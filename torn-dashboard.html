<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Torn HQ</title>
<style>
:root{--a:#2aa6b8;--b:#5aa84a;--g:#7bd66b;--r:#e0655a;--y:#e8c55a;--m:#b9b5a3;--cr:#efe6c8;--wd:#a8743a}
*{box-sizing:border-box}
body{margin:0;color:#f2efe4;font:15px -apple-system,system-ui,sans-serif;background:linear-gradient(#d8d1ba,#c4bda4 60%,#a9a38e) fixed;padding:0 12px 96px;min-height:100vh}
body::before{content:"";position:fixed;left:0;right:0;bottom:0;height:240px;background:#2c312e;opacity:.2;pointer-events:none;clip-path:polygon(0 100%,0 62%,6% 62%,6% 38%,12% 38%,12% 52%,18% 52%,18% 22%,24% 22%,24% 56%,31% 56%,31% 32%,38% 32%,38% 66%,45% 66%,45% 26%,52% 26%,52% 50%,60% 50%,60% 14%,67% 14%,67% 46%,75% 46%,75% 30%,82% 30%,82% 60%,90% 60%,90% 38%,100% 38%,100% 100%)}
#app,#login{position:relative;z-index:1}
h1,h2{margin:0;font-family:Georgia,serif}h1 span{color:var(--y)}h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--cr);margin-bottom:10px}
a{color:var(--a)}.m{color:var(--m);font-size:12px}
.card{background:#1c2220;border:5px solid var(--wd);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 0 30px rgba(0,0,0,.5)}
header{margin:0 -12px 12px;padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;background:#2f3a3a;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:4px solid #1d2424}
.code{font:700 12px Georgia,serif;color:#9fb0ac;letter-spacing:.15em}.logo{font:900 25px Georgia,serif;letter-spacing:.04em;color:var(--cr);text-transform:uppercase;line-height:1.05}
.sub{font:700 11px Georgia,serif;letter-spacing:.35em;color:#c9c3a8;margin:3px 0 6px}
.live{font-size:12px;color:var(--g);font-weight:700}.live.off{color:var(--r)}.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);margin-right:6px;animation:p 1.6s infinite}
@keyframes p{70%{box-shadow:0 0 0 9px transparent}0%{box-shadow:0 0 0 0 var(--g)}}
input,select{width:100%;padding:11px;border-radius:8px;border:1px solid #5a5f58;background:#121615;color:#f2efe4;font-size:16px;margin-bottom:8px}
.btn,.ghost{border:0;border-radius:8px;padding:11px 16px;font-weight:800;font-size:14px}.btn{background:var(--cr);color:#241d14}.ghost{background:rgba(239,230,200,.14);color:var(--cr);padding:7px 10px;font-size:12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}.row:last-child{border:0}
.big{font:900 30px Georgia,serif;color:var(--cr)}.timer{font:900 28px Georgia,serif;font-variant-numeric:tabular-nums;color:var(--y)}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin:3px 0 10px}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--a))}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.day{background:#141918;border-radius:10px;padding:10px;text-align:center}.day .n{font:900 24px Georgia,serif}
.x{color:var(--r)}.f{color:var(--a)}.s{color:var(--g)}
.bars{display:flex;gap:3px;height:90px}.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.bars b{width:100%;border-radius:4px 4px 0 0;min-height:2px}.bars small{font-size:9px;color:var(--m)}.bars em{font-size:9px;font-style:normal}
.tab{display:none}.tab.on{display:block}
nav{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);display:flex;gap:3px;background:#7a5230;border:3px solid #4d321a;border-radius:14px;padding:4px;z-index:5}
nav button{flex:1;background:0;border:0;color:#e9dcc0;padding:9px 0;border-radius:9px;font:700 11px Georgia,serif}nav button.on{background:var(--cr);color:#2a2118}
details{border-bottom:1px solid rgba(255,255,255,.08);padding:6px 0;font-size:13px}summary{display:flex;gap:8px;cursor:pointer}summary span{color:var(--m);min-width:92px}pre{white-space:pre-wrap;font-size:11px;color:var(--m);margin:6px 0 0}
.pill{display:inline-block;background:rgba(90,168,74,.25);border:1px solid var(--b);border-radius:20px;padding:4px 10px;margin:3px 3px 0 0;font-size:12px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{background:#232826;border:2px solid #4a514c;border-radius:10px;padding:10px 6px;text-align:center;font-size:13px;color:var(--cr)}.tile small{display:block;color:var(--m);font-size:10px;margin-top:2px}.tile.on{border-color:var(--g)}.ti{font-size:24px}
#err{color:var(--r);margin-top:8px}
</style></head><body>
<div id="login" class="card" style="margin-top:12vh;text-align:center"><h1 style="font-size:40px;font-weight:900">TORN <span>HQ</span></h1><p class="m">Paste your Full Access API key</p><input id="key" placeholder="API key" autocomplete="off"><button class="btn" onclick="doLogin()">Connect</button><div id="err"></div></div>
<div id="app" hidden>
<header><div><div class="code" id="pid"></div><div class="logo" id="ttl">TORN HQ</div><div class="sub">TORN CITY EDITION</div><div id="who" class="live">…</div></div><div style="text-align:right"><div id="cd" class="m"></div><button class="ghost" onclick="logout()">Log out</button></div></header>
<section id="t-ov" class="tab on"><div id="ov"></div><div id="adv"></div><div id="ps"></div></section>
<section id="t-ac" class="tab"><div id="ac"></div></section>
<section id="t-lg" class="tab"><div id="rep"></div><div id="tiles"></div>
<div class="card"><h2>Log Explorer</h2><input id="q" placeholder="Search logs (xanax, travel, bazaar…)" oninput="renderLogs()"><select id="cat" onchange="renderLogs()"></select>
<button class="btn" onclick="pullLogs(5,true)">Load older</button> <button class="ghost" onclick="csv()">Export CSV</button><div id="lstat" class="m" style="margin-top:8px"></div></div>
<div class="card"><h2>Live feed</h2><div id="live"></div></div><div class="card"><h2>Events per day</h2><div id="cday"></div></div><div class="card"><h2>Activity by hour</h2><div id="chour"></div></div>
<div class="card"><h2>Top actions</h2><div id="top"></div></div></section>
<section id="t-bk" class="tab"><div id="bk"></div></section>
<section id="t-tl" class="tab"><div id="cal"></div><div id="tl"></div><div class="card"><h2>Gambling · manual tracker</h2><input id="ga" type="number" inputmode="decimal" placeholder="Amount"><button class="btn" onclick="gAdd(1)">+ Win</button> <button class="ghost" onclick="gAdd(0)">− Loss</button> <button class="ghost" onclick="gRes()">Reset</button><div id="gn" class="m" style="margin-top:8px"></div></div></section>
<section id="t-sc" class="tab"><div id="sc"></div></section>
<nav><button class="on" onclick="go('ov',this)">Home</button><button onclick="go('ac',this)">Daily</button><button onclick="go('lg',this)">Reports</button><button onclick="go('bk',this)">Bank</button><button onclick="go('tl',this)">Tools</button><button onclick="go('sc',this)">Scripts</button></nav>
</div>
<script>
const $=i=>document.getElementById(i),fmt=n=>Number(n).toLocaleString(),$$=n=>'$'+fmt(Math.round(n)),pad=n=>String(n).padStart(2,'0'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let KEY='',D={},BANK=null,EV=[],BARS=null,CR=null,LT=null,LTE='',PS=null,HIST={},CAL=null,TRV=null,ATK=null,INV=null,ATKE='',SLOT=null,USE=true,CALERR='',CV=[],MER=null,LOGS=new Map(),eduEnd=0,cd=20,tk=0,loading=false;
const TR={standard:['Standard ticket',1],airstrip:['Private airstrip (island)',.7],private:['Private jet',.5],business:['Business / first class',.3]};
const DESTS=['South Africa','Mexico','Cayman Islands','Canada','Hawaii','United Kingdom','Argentina','Switzerland','Japan','China','UAE'];
const dest=e=>{const s=(JSON.stringify(e.data||{})+JSON.stringify(e.params||{})).toLowerCase();return DESTS.find(d=>s.includes(d.toLowerCase()))||null};
const lsg=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
async function api(sel,extra=''){const r=await fetch(`https://api.torn.com/user/?selections=${sel}&key=${KEY}${extra}`);const d=await r.json();if(d.error)throw new Error(d.error.error);return d}
async function doLogin(k){KEY=(k||$('key').value).trim();if(!KEY)return;$('err').textContent='';
try{await refresh(true);lss('tk',KEY);$('login').hidden=true;$('app').hidden=false;renderAct();renderSc();renderTiles();pullLogs(15,false)}catch(e){$('err').textContent='Error: '+e.message}}
function logout(){try{localStorage.removeItem('tk')}catch(e){}location.reload()}
function go(t,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));$('t-'+t).classList.add('on');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
async function refresh(strict){try{D=await api('profile,battlestats,networth,education')}catch(e){if(strict)throw e;$('who').className='live off';$('who').textContent='● connection problem: '+e.message;return}
$('who').className='live';$('ttl').textContent=D.name.replace(/[-_]/g,' ');$('pid').textContent=D.player_id;$('who').innerHTML=`<i></i>LOGGED IN · ${esc(D.name)} [${D.player_id}]`;
eduEnd=D.education_timeleft?Date.now()/1e3+D.education_timeleft:0;renderOv();
try{BANK=(await api('money')).city_bank||null}catch(e){}
if(!MER)try{MER=(await api('merits')).merits||null}catch(e){}
try{TRV=(await api('travel')).travel||null}catch(e){}renderOv();renderAct();
renderBank();extras()}
function renderOv(){const d=D,st=['strength','defense','speed','dexterity'],v=st.map(s=>+d[s]||0),mx=Math.max(...v,1),low=st[v.indexOf(Math.min(...v))];
const nw=d.networth||{},tot=nw.total,rest=Object.entries(nw).filter(([k,x])=>k!='total'&&typeof x=='number'&&x!=0&&!/time|stamp|date/i.test(k)).sort((a,b)=>b[1]-a[1]);
const done=d.education_completed?d.education_completed.length:0;
$('ov').innerHTML=`<div class="card"><div style="font-size:22px;font-weight:900">${esc(d.name)} <span class="m">Lv ${d.level}</span></div><div class="m">${esc(d.status?d.status.description:'')}</div></div>
${travelCard()}<div class="card"><h2>Education</h2>${d.education_current?`<div id="edu" class="timer">…</div><div class="m">Course ID ${d.education_current} · ${done} completed</div>`:`<div id="edu" class="timer" style="color:var(--r)">No course running</div><div class="m">${done} completed · start the next one!</div>`}</div>
<div class="card"><h2>Net worth</h2>${tot!=null?`<div class="big">${$$(tot)}</div>`:'<div class="m">Needs a Full Access key</div>'}${rest.map(([k,x])=>`<div class="row"><span>${k}</span><span>${$$(x)}</span></div>`).join('')}</div>
<div class="card"><h2>Battle stats</h2>${v[0]||v[1]?st.map((s,i)=>`<div class="row" style="border:0;padding-bottom:0"><span>${s}${s==low?' ⚡ train':''}</span><span>${fmt(v[i])}</span></div><div class="bar"><b style="width:${v[i]/mx*100}%"></b></div>`).join('')+`<div class="m">Lowest is <b>${low}</b>. Train it for balance, or ignore if you're specialising.</div>`:'<div class="m">Needs a Full Access key</div>'}</div>`}
function renderAct(){renderAct0();$('ac').insertAdjacentHTML('afterbegin',travelCard());$('ac').insertAdjacentHTML('beforeend',flightCard())}
function renderAct0(){const sel=lsg('tr')||'standard',t=TR[sel],one=Math.round(297*t[1]);
const days=[0,1,2].map(i=>{const d=new Date();d.setDate(d.getDate()-i);return d.toDateString()}),names=['Today','Yesterday','2 days ago'];
const FL=flightDest(),anyDest=true;
const R=days.map(k=>{let x=0,f=0,sa=0,bu=0;LOGS.forEach(e=>{if(new Date(e.timestamp*1e3).toDateString()!=k)return;const t=e.title||'';if(/use xanax/i.test(t))x++;else if(/travel depart/i.test(t)){f++;if(FL[e.id]=='South Africa')sa++}else if(/abroad buy/i.test(t))bu++});return{x,f,sa,bu}});
$('ac').innerHTML=`<div class="card"><h2>Travel method</h2><select onchange="lss('tr',this.value);renderAct()">${Object.entries(TR).map(([k,v])=>`<option value="${k}" ${k==sel?'selected':''}>${v[0]}</option>`).join('')}</select>
<div class="row"><span>South Africa one-way ≈</span><span>${hm2(one)}</span></div><div class="row"><span>Round trip ≈</span><span>${hm2(one*2)}</span></div><div class="row"><span>Max round trips / 24h</span><span>${Math.floor(1440/(one*2))}</span></div><div class="m">Destinations are estimated from flight time. If your real S. Africa one-way differs, enter it (h:mm):</div><input placeholder="e.g. 3:15" value="${lsg('sa')||''}" onchange="lss('sa',this.value);renderAct()"></div>
${R.map((r,i)=>`<div class="card"><h2>${names[i]}</h2><div class="grid"><div class="day"><div class="n x">${r.x}</div><div class="m">Xanax</div></div><div class="day"><div class="n f">${r.f}</div><div class="m">Flights</div></div><div class="day"><div class="n s">${anyDest?r.sa:'n/a'}</div><div class="m">To S. Africa</div></div></div><div class="m" style="margin-top:8px">Xanax ${i==0?'so far today':'that day'}: <b>${r.x}</b></div></div>`).join('')}
${anyDest?'':'<div class="m">Your log entries don\'t include flight destinations, so the South Africa count can\'t be shown.</div>'}`}
async function pullLogs(pages,older){if(loading)return;loading=true;$('lstat').textContent='Loading logs…';
try{let to=older&&LOGS.size?Math.min(...[...LOGS.values()].map(e=>e.timestamp))-1:0;const c=new Date();c.setHours(0,0,0,0);const cut=c/1e3-172800;
for(let i=0;i<pages;i++){const d=await api('log','&limit=100'+(to?'&to='+to:''));const a=Object.entries(d.log||{});if(!a.length)break;let old=1e12;a.forEach(([id,e])=>{e.id=id;LOGS.set(id,e);old=Math.min(old,e.timestamp)});to=old-1;if(!older&&old<cut)break}}
catch(e){$('lstat').textContent='Log error: '+e.message+' (key needs log access)'}
loading=false;renderLogs();renderAct();renderTools();renderTiles();renderRep()}
function bars(v,l,c){const m=Math.max(...v,1);return `<div class="bars">${v.map((x,i)=>`<div><em>${x||''}</em><b style="height:${x/m*70}px;background:${c}"></b><small>${l[i]}</small></div>`).join('')}</div>`}
function renderLogs(){const all=[...LOGS.values()].sort((a,b)=>b.timestamp-a.timestamp),cats=[...new Set(all.map(e=>e.category).filter(Boolean))].sort(),sel=$('cat'),cur=sel.value;
sel.innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option ${c==cur?'selected':''}>${esc(c)}</option>`).join('');
const q=$('q').value.toLowerCase(),c=sel.value,f=all.filter(e=>(!c||e.category==c)&&(!q||((e.title||'')+JSON.stringify(e.data||{})).toLowerCase().includes(q)));
$('lstat').textContent=`${f.length} of ${all.length} entries loaded`;$('live').innerHTML=f.slice(0,25).map(e=>`<div class="row"><span class="m">${new Date(e.timestamp*1e3).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span><span>${esc(e.title)}</span></div>`).join('');
const dk=[...new Set(f.map(e=>new Date(e.timestamp*1e3).toDateString()))].slice(0,7).reverse();
$('cday').innerHTML=bars(dk.map(k=>f.filter(e=>new Date(e.timestamp*1e3).toDateString()==k).length),dk.map(k=>k.slice(4,10)),'linear-gradient(var(--a),var(--b))');
const h=Array(24).fill(0);f.forEach(e=>h[new Date(e.timestamp*1e3).getHours()]++);
$('chour').innerHTML=bars(h,h.map((_,i)=>i%3?'':i),'linear-gradient(var(--g),var(--a))');
const tc={};f.forEach(e=>tc[e.title]=(tc[e.title]||0)+1);
$('top').innerHTML=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,n])=>`<div class="row"><span>${esc(k)}</span><b>${n}</b></div>`).join('')||'<div class="m">No data yet</div>';
}
function csv(){const a=[...LOGS.values()].sort((x,y)=>y.timestamp-x.timestamp),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
const u=URL.createObjectURL(new Blob([['time,category,title,data'].concat(a.map(e=>[new Date(e.timestamp*1e3).toISOString(),e.category,e.title,JSON.stringify(e.data||{})].map(q).join(','))).join('\n')],{type:'text/csv'}));const l=document.createElement('a');l.href=u;l.download='torn-logs.csv';l.click()}
const ADV=[[/bank|interest/i,'Boosts every investment payout, so it grows with your daily income.'],[/addiction/i,'You take Xanax daily and use rehab, so this directly helps.'],[/drug|booster/i,'You rely on Xanax, so shorter drug cooldowns help.'],[/education/i,'You run courses constantly, so shorter courses finish more of them.'],[/medical|revive/i,'Cuts medical cooldowns, useful during faction wars.'],[/nerve/i,'More nerve means more crimes and OC readiness.']];
const bf=(b,re)=>{for(const k in b){if(re.test(k)&&b[k]!=null&&b[k]!=='')return b[k]}return null};
function renderBank(){const b=BANK;let h='<div class="card"><h2>Bank investment</h2>';
if(b&&b.amount){const rate=+bf(b,/rate|interest/i)||0,dur=+bf(b,/dur|period|days/i)||0,pr=+bf(b,/profit/i)||(rate?b.amount*rate/100:0),un=+bf(b,/until|end/i)||0;
h+=`<div class="big">${$$(b.amount)}</div><div class="m">invested${dur?' · '+dur+' days':''}${rate?' · '+rate+'%':''}</div>`;
if(pr){h+=`<div class="row"><span>Profit at payout</span><b class="s">${$$(pr)}</b></div>`+(dur?`<div class="row"><span>Per day</span><span>${$$(pr/dur)}</span></div><div class="row"><span>Per 30 days</span><span>${$$(pr/dur*30)}</span></div>`:'')}
else h+='<div class="m">Torn did not return the rate or profit. Use the calculator below.</div>';
if(un>1e9)h+=`<div class="row"><span>Pays out</span><span>${new Date(un*1e3).toLocaleString()}</span></div>`;
}
else h+='<div class="m">No active investment found. Use the calculator below.</div>';
h+=`</div><div class="card"><h2>What-if calculator</h2><input id="wa" type="number" inputmode="decimal" placeholder="Amount" value="${b&&b.amount||''}" oninput="wif()"><input id="wr" type="number" inputmode="decimal" placeholder="Rate % for the period (from the bank page)" value="${b&&b.interest_rate||''}" oninput="wif()"><input id="wd" type="number" inputmode="decimal" placeholder="Period in days" value="${b&&b.duration||''}" oninput="wif()"><div id="wo" class="m">Enter the three numbers.</div></div>`;
const m=MER&&typeof MER=='object'?Object.entries(MER).map(([k,v])=>[k,+(v&&v.level!==undefined?v.level:v)||0]):[];
if(m.length){const spent=m.reduce((s,x)=>s+x[1],0),mx=Math.max(...m.map(x=>x[1]),1);
h+=`<div class="card"><h2>Your merits · ${spent} levels bought</h2>${m.sort((a,b)=>b[1]-a[1]).map(([k,l])=>`<div class="row" style="border:0;padding-bottom:0"><span>${esc(k)}</span><span>${l}</span></div><div class="bar"><b style="width:${l/mx*100}%"></b></div>`).join('')}</div>`;
const sug=ADV.map(([re,why])=>{const hit=m.find(x=>re.test(x[0]));return hit?{n:hit[0],l:hit[1],why}:null}).filter(Boolean).sort((a,b)=>a.l-b.l).slice(0,4);
h+=`<div class="card"><h2>Suggested next merits</h2>${sug.length?sug.map(s=>`<div class="row"><span><b>${esc(s.n)}</b> <span class="m">(level ${s.l})</span><br><span class="m">${s.why}</span></span></div>`).join('')+'<div class="m" style="margin-top:6px">Ranked by your habits (Xanax, rehab, investing, education, wars), lowest level first.</div>':'<div class="m">No matching merits found in your data.</div>'}</div>`}
else h+='<div class="card"><h2>Merits</h2><div class="m">Merit data not available with this key.</div></div>';
h+=rates();$('bk').innerHTML=h;wif()}
function wif(){const a=+$('wa')?.value,r=+$('wr')?.value,d=+$('wd')?.value;if(!$('wo'))return;$('wo').innerHTML=a&&r&&d?`Profit <b class="s">${$$(a*r/100)}</b> · ${$$(a*r/100/d)}/day · ${$$(a*r/100/d*30)}/30 days`:'Enter the three numbers.'}
const PAL=['#2aa6b8','#7bd66b','#e8c55a','#e0655a','#b08be0','#d89a52','#6fa8ff','#a8c97a','#e07ab0','#b9b5a3'];
const GAM=/casino|slots|roulette|blackjack|poker|russian|lottery|wheel|keno|high.?low|craps|bookie|baccarat|\bbet\b/i;
const tag=s=>String(s||'').replace(/<[^>]*>/g,'');
function pie(it,f){const t=it.reduce((s,x)=>s+x[1],0)||1;let a=0;const g=it.map((x,i)=>{const b=a;a+=x[1]/t*100;return PAL[i%10]+' '+b+'% '+a+'%'}).join(',');
return `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="width:130px;height:130px;border-radius:50%;background:conic-gradient(${g});box-shadow:0 0 24px rgba(0,229,255,.25);flex:none"></div><div style="flex:1;min-width:140px;font-size:13px">${it.map((x,i)=>`<div><span style="color:${PAL[i%10]}">●</span> ${esc(x[0])} <b>${f(x[1])}</b> <span class="m">${Math.round(x[1]/t*100)}%</span></div>`).join('')}</div></div>`}
